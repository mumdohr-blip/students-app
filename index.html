<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B7A93">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="طلاب المستر رضا">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>طلاب المستر رضا</title>
</head>
<body>
<script>function _err(m){var a=document.getElementById("app");a.innerHTML="<div style=\"padding:20px;font-family:sans-serif;direction:rtl\"><h3>حصلت مشكلة ⚠️</h3><p style=\"direction:ltr;text-align:left;word-break:break-all\">"+String(m).replace(/</g,"&lt;")+"</p><button onclick=\"location.reload()\" style=\"font-size:18px;padding:10px 20px\">إعادة المحاولة</button></div>"}window.addEventListener("error",function(e){_err(e.message||"error")});window.addEventListener("unhandledrejection",function(e){_err(e.reason&&e.reason.message||e.reason)});</script>
<div id="app"><p style="padding:20px;font-family:sans-serif">جاري التحميل…</p></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
